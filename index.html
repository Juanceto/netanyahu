<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rasismo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Caveat:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Caveat', cursive;
    overflow: hidden;
  }

  /* ── Emoji rain ── */
  .emoji-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .emoji-particle {
    position: absolute;
    animation: fall linear infinite;
    opacity: 0.15;
    user-select: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-80px) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.15; }
    92%  { opacity: 0.15; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ── Hint text ── */
  .hint {
    position: fixed;
    top: 28px; left: 50%;
    transform: translateX(-50%);
    color: #c9a8ff;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    animation: pulse 2s ease-in-out infinite;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

  /* ── Confetti ── */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
  .confetti-piece {
    position: absolute;
    opacity: 0;
    animation: cfall ease-out forwards;
  }
  @keyframes cfall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(80vh) rotate(800deg) scale(0.2); }
  }

  /* ════════════════════════════════
     ENVELOPE
  ════════════════════════════════ */
  .envelope-wrap {
    position: relative;
    z-index: 10;
    width: 360px;
    height: 240px;
    cursor: pointer;
    perspective: 900px;
    transition: opacity 0.4s ease 0s, transform 0.4s ease 0s;
    flex-shrink: 0;
  }
  .envelope-wrap.gone {
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
    transition: opacity 0.4s ease 0.6s, transform 0.4s ease 0.6s;
  }
  .envelope-wrap:not(.opened):hover .env-body {
    box-shadow: 0 14px 70px #7c3aed88;
  }

  .env-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #f5e6cc, #e8ccaa);
    border-radius: 4px 4px 8px 8px;
    box-shadow: 0 10px 50px #00000077;
    overflow: hidden;
  }
  .env-body::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom right, transparent 49.5%, #c8a87a40 49.5%, #c8a87a40 50.5%, transparent 50.5%),
      linear-gradient(to bottom left,  transparent 49.5%, #c8a87a40 49.5%, #c8a87a40 50.5%, transparent 50.5%);
    pointer-events: none;
  }

  .env-flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 145px;
    background: linear-gradient(170deg, #e0c28a, #c8a070);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.4,0,.2,1);
    z-index: 8;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px #0003);
  }
  .envelope-wrap.opened .env-flap { transform: rotateX(-180deg); }

  .seal {
    position: absolute;
    top: 110px; left: 50%;
    transform: translateX(-50%);
    width: 52px; height: 52px;
    background: radial-gradient(circle at 35% 35%, #8b5cf6, #4c1d95);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.45rem;
    box-shadow: 0 3px 14px #4c1d9566;
    z-index: 9;
    transition: opacity 0.2s 0.05s, transform 0.2s 0.05s;
  }
  .envelope-wrap.opened .seal {
    opacity: 0;
    transform: translateX(-50%) scale(0.2);
    pointer-events: none;
  }

  /* ════════════════════════════════
     CARD
     — posición inicial calculada por JS en base al centro real del sobre
     — sube al centro exacto de la pantalla al abrirse
  ════════════════════════════════ */
  .card-wrapper {
    position: fixed;
    width: 320px;
    height: 220px;
    z-index: 5;
    perspective: 1000px;
    pointer-events: none;
    /* posición y transform inicial se setean por JS */
    will-change: transform;
  }

  .card-wrapper.rising {
    z-index: 30;
    pointer-events: auto;
    /* el transform final también se setea por JS */
  }

  /* ── 3D flip ── */
  .card-3d {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  .card-3d.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
    gap: 6px;
  }

  /* Front */
  .card-front {
    background: linear-gradient(140deg, #fff9f0, #fde8c0);
    box-shadow: 0 12px 48px #0005;
    border: 1.5px solid #e8c890;
  }
  .card-front h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #7c3aed;
    text-align: center;
    line-height: 1.2;
  }
  .card-front .sub {
    font-size: 0.92rem;
    color: #92400e;
    text-align: center;
    line-height: 1.3;
  }
  .emoji-dec { font-size: 1.5rem; }
  .flip-hint { font-size: 0.75rem; color: #b45309; opacity: 0.55; margin-top: 4px; }

  /* Back */
  .card-back {
    background: linear-gradient(140deg, #fafff4, #d4f5e2);
    box-shadow: 0 12px 48px #0005;
    border: 1.5px solid #86efac;
    transform: rotateY(180deg);
    gap: 10px;
  }
  .card-back h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: #166534;
    font-style: italic;
  }
  .card-back video {
    border-radius: 12px;
    max-width: 100%;
    height: 130px;
    object-fit: cover;
    box-shadow: 0 4px 16px #0004;
  }
</style>
</head>
<body>

<div class="emoji-bg" id="emojiBg"></div>
<div class="confetti-container" id="confetti"></div>
<p class="hint" id="hint">✉️ Tocá el sobre para abrirlo</p>

<!-- CARD -->
<div class="card-wrapper" id="cardWrapper">
  <div class="card-3d" id="card3d">
    <div class="card-face card-front">
      <div class="emoji-dec"></div>
      <h1>feli cumplanio 16<br> shabbat shalom</h1>
      <p class="sub">judia, agente del mossad, sionista,<br>beneficiante del estado ilegítimo de israel</p>
      <div class="emoji-dec"></div>
      <span class="flip-hint">👆 Dale la vuelta a la carta</span>
    </div>
    <div class="card-face card-back">
      <h2>pues chad no? </h2>
      <video src="Perkin.mp4" height="300" width="300" controls  style="border-radius:12px"></video>
    </div>
  </div>
</div>

<!-- ENVELOPE -->
<div class="envelope-wrap" id="envelope">
  <div class="env-body"></div>
  <div class="env-flap"></div>
  <div class="seal">✡️</div>
</div>

<script>
  // Emoji rain
  const emojis = ['🇮🇱','✡️','🕍','🕎','🌟','💙','🤍','🎂','🎉','🥳','🎊','🎈','✨','💜','🎁'];
  const bg = document.getElementById('emojiBg');
  for (let i = 0; i < 44; i++) {
    const el = document.createElement('div');
    el.className = 'emoji-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (1 + Math.random() * 1.3) + 'rem';
    el.style.animationDuration = (7 + Math.random() * 11) + 's';
    el.style.animationDelay  = -(Math.random() * 16) + 's';
    bg.appendChild(el);
  }

  const env     = document.getElementById('envelope');
  const wrapper = document.getElementById('cardWrapper');
  const card    = document.getElementById('card3d');
  const hint    = document.getElementById('hint');
  let opened = false, flipped = false;

  // ── Calcular posición inicial de la carta en base al sobre real ──
  function initCard() {
    const envRect = env.getBoundingClientRect();
    const cw = wrapper.offsetWidth;
    const ch = wrapper.offsetHeight;

    // Centrar la carta horizontalmente sobre el sobre
    const left = envRect.left + (envRect.width / 2) - (cw / 2);
    // Colocar la carta en la parte inferior del sobre (invisible, tapada por el sobre)
    const top  = envRect.top  + (envRect.height / 2) - (ch / 2);

    wrapper.style.left = left + 'px';
    wrapper.style.top  = top  + 'px';
    // scaleY(0) → invisible, desde el centro del sobre
    wrapper.style.transform = 'scaleY(0)';
    wrapper.style.transformOrigin = 'center center';
    wrapper.style.transition = 'none';
  }

  // ── Al abrir: animar al centro exacto de la pantalla ──
  function riseCard() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const cw = wrapper.offsetWidth;
    const ch = wrapper.offsetHeight;

    const targetLeft = (vw - cw) / 2;
    const targetTop  = (vh - ch) / 2;

    // Aplicar posición destino
    wrapper.style.left = targetLeft + 'px';
    wrapper.style.top  = targetTop  + 'px';
    wrapper.style.transform = 'scaleY(1)';
    wrapper.style.transformOrigin = 'center center';
    wrapper.style.transition = 'left 0.85s cubic-bezier(0.34,1.2,0.64,1) 0.45s, top 0.85s cubic-bezier(0.34,1.2,0.64,1) 0.45s, transform 0.85s cubic-bezier(0.34,1.2,0.64,1) 0.45s';
    wrapper.style.zIndex = '30';
    wrapper.style.pointerEvents = 'auto';
  }

  // Inicializar posición de la carta cuando carga
  window.addEventListener('load', initCard);
  window.addEventListener('resize', () => { if (!opened) initCard(); });

  env.addEventListener('click', () => {
    if (opened) return;
    opened = true;

    env.classList.add('opened');

    setTimeout(() => riseCard(), 50);

    setTimeout(() => env.classList.add('gone'), 900);

    setTimeout(() => {
      hint.textContent = '↕️ Dale vuelta a la carta';
    }, 1350);

    launchConfetti();
  });

  card.addEventListener('click', () => {
    if (!opened) return;
    flipped = !flipped;
    card.classList.toggle('flipped', flipped);
    hint.textContent = flipped ? '↩️ Dale vuelta de nuevo' : '↕️ Dale vuelta a la carta';
  });

  function launchConfetti() {
    const ct = document.getElementById('confetti');
    const colors = ['#7c3aed','#f59e0b','#10b981','#ef4444','#3b82f6','#ec4899','#fbbf24','#fff'];
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left   = (5 + Math.random() * 90) + '%';
      p.style.top    = (Math.random() * 40) + '%';
      p.style.width  = (6 + Math.random() * 9) + 'px';
      p.style.height = (6 + Math.random() * 9) + 'px';
      p.style.background   = colors[Math.floor(Math.random() * colors.length)];
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      p.style.animationDelay    = (Math.random() * 0.7) + 's';
      p.style.animationDuration = (1.3 + Math.random() * 1.5) + 's';
      ct.appendChild(p);
      setTimeout(() => p.remove(), 3500);
    }
  }
</script>
</body>
</html>
