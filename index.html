<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rasismo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Caveat:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Caveat', cursive;
    overflow: hidden;
  }

  /* ── Emoji rain ── */
  .emoji-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .emoji-particle {
    position: absolute;
    animation: fall linear infinite;
    opacity: 0.15;
    user-select: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-80px) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.15; }
    92%  { opacity: 0.15; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ── Hint text ── */
  .hint {
    position: fixed;
    top: 28px; left: 50%;
    transform: translateX(-50%);
    color: #c9a8ff;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    animation: pulse 2s ease-in-out infinite;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

  /* ── Confetti ── */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
  .confetti-piece {
    position: absolute;
    opacity: 0;
    animation: cfall ease-out forwards;
  }
  @keyframes cfall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(80vh) rotate(800deg) scale(0.2); }
  }

  /* ════════════════════════════════
     ENVELOPE
  ════════════════════════════════ */
  .envelope-wrap {
    position: relative;
    z-index: 10;
    width: 360px;
    height: 240px;
    cursor: pointer;
    perspective: 900px;
    /* fade out after card is free */
    transition: opacity 0.4s ease 0s, transform 0.4s ease 0s;
  }
  .envelope-wrap.gone {
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
    transition: opacity 0.4s ease 0.6s, transform 0.4s ease 0.6s;
  }
  .envelope-wrap:not(.opened):hover .env-body {
    box-shadow: 0 14px 70px #7c3aed88;
  }

  /* Envelope body — overflow:hidden so card is invisible while inside */
  .env-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #f5e6cc, #e8ccaa);
    border-radius: 4px 4px 8px 8px;
    box-shadow: 0 10px 50px #00000077;
    overflow: hidden;
  }
  /* V-fold decoration */
  .env-body::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom right, transparent 49.5%, #c8a87a40 49.5%, #c8a87a40 50.5%, transparent 50.5%),
      linear-gradient(to bottom left,  transparent 49.5%, #c8a87a40 49.5%, #c8a87a40 50.5%, transparent 50.5%);
    pointer-events: none;
  }

  /* Top flap — triangle via clip-path */
  .env-flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 145px;
    background: linear-gradient(170deg, #e0c28a, #c8a070);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.4,0,.2,1);
    z-index: 8;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px #0003);
  }
  .envelope-wrap.opened .env-flap { transform: rotateX(-180deg); }

  /* Wax seal */
  .seal {
    position: absolute;
    top: 110px; left: 50%;
    transform: translateX(-50%);
    width: 52px; height: 52px;
    background: radial-gradient(circle at 35% 35%, #8b5cf6, #4c1d95);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.45rem;
    box-shadow: 0 3px 14px #4c1d9566;
    z-index: 9;
    transition: opacity 0.2s 0.05s, transform 0.2s 0.05s;
  }
  .envelope-wrap.opened .seal {
    opacity: 0;
    transform: translateX(-50%) scale(0.2);
    pointer-events: none;
  }

  /* ════════════════════════════════
     CARD — starts inside envelope (z behind env-body, scaled to 0)
     then flies to center of screen
  ════════════════════════════════ */
  .card-wrapper {
    /* initially positioned inside the envelope area */
    position: fixed;           /* fixed so we can center it on screen */
    top: 50%; left: 50%;
    transform: translate(-50%, 130px) scaleY(0); /* 130px = below center ~ envelope position */
    transform-origin: bottom center;
    width: 320px;
    height: 210px;
    z-index: 5;                /* starts behind the envelope (z-index 10) */
    perspective: 1000px;
    pointer-events: none;
    /* no transition while closed */
    transition: none;
  }

  /* Phase 1: card rises out of envelope to center (delayed after flap opens) */
  .card-wrapper.rising {
    transform: translate(-50%, -50%) scaleY(1);
    transition: transform 0.85s cubic-bezier(0.34, 1.2, 0.64, 1) 0.45s;
    z-index: 30;
    pointer-events: auto;
  }

  /* ── 3D flip ── */
  .card-3d {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  .card-3d.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
    gap: 6px;
  }

  /* Front */
  .card-front {
    background: linear-gradient(140deg, #fff9f0, #fde8c0);
    box-shadow: 0 12px 48px #0005;
    border: 1.5px solid #e8c890;
  }
  .card-front h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.65rem;
    color: #7c3aed;
    text-align: center;
    line-height: 1.2;
  }
  .card-front .sub { font-size: 1.05rem; color: #92400e; text-align: center; }
  .emoji-dec { font-size: 1.6rem; }
  .flip-hint { font-size: 0.78rem; color: #b45309; opacity: 0.55; margin-top: 4px; }

  /* Back */
  .card-back {
    background: linear-gradient(140deg, #fafff4, #d4f5e2);
    box-shadow: 0 12px 48px #0005;
    border: 1.5px solid #86efac;
    transform: rotateY(180deg);
  }
  .card-back h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: #166534;
    font-style: italic;
    margin-bottom: 4px;
  }
  .back-text {
    font-size: 1.1rem;
    color: #14532d;
    text-align: center;
    line-height: 1.6;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div class="emoji-bg" id="emojiBg"></div>
<div class="confetti-container" id="confetti"></div>
<p class="hint" id="hint"></p>

<!-- CARD: exists in DOM independently, starts visually "inside" envelope via transform -->
<div class="card-wrapper" id="cardWrapper">
  <div class="card-3d" id="card3d">
    <div class="card-face card-front">
      <div class="emoji-dec"</div>
      <h1>feli cumplanio 16</h1>
      <p class="sub">judia, agente del mossad, sionista, beneficiante del estado ilegitimo de israel</p>
      <div class="emoji-dec"</div>
      <span class="flip-hint">👆 Dale la vuelta a la carta</span>
    </div>
    <div class="card-face card-back">
      <h2>pues chad no?
    </h2>
      <p> <video src="Perkin.mp4" height="150"
      width="150" border-radius="20"></p>
    </div>
  </div>
</div>

<!-- ENVELOPE: rendered on top while closed -->
<div class="envelope-wrap" id="envelope">
  <div class="env-body"></div>
  <div class="env-flap"></div>
  <div class="seal">✡️</div>
</div>

<script>
  // ═══════════════════════════════════
  //   EDITÁ ESTE MENSAJE
  

  // Emoji rain
  const emojis = ['🇮🇱','✡️','🕍','🕎','🌟','💙','🤍','🎂','🎉','🥳','🎊','🎈','✨','💜','🎁'];
  const bg = document.getElementById('emojiBg');
  for (let i = 0; i < 44; i++) {
    const el = document.createElement('div');
    el.className = 'emoji-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (1 + Math.random() * 1.3) + 'rem';
    el.style.animationDuration = (7 + Math.random() * 11) + 's';
    el.style.animationDelay  = -(Math.random() * 16) + 's';
    bg.appendChild(el);
  }

  const env     = document.getElementById('envelope');
  const wrapper = document.getElementById('cardWrapper');
  const card    = document.getElementById('card3d');
  const hint    = document.getElementById('hint');
  let opened = false, flipped = false;

  // Click envelope → sequence: flap opens → card rises → envelope fades
  env.addEventListener('click', () => {
    if (opened) return;
    opened = true;

    // 1. Open the flap immediately
    env.classList.add('opened');

    // 2. After flap opens (~450ms), start card rising
    setTimeout(() => {
      wrapper.classList.add('rising');
    }, 50);

    // 3. Once card is free in the air (~950ms total), disappear envelope
    setTimeout(() => {
      env.classList.add('gone');
    }, 900);

    // 4. Update hint after card has landed
    setTimeout(() => {
      hint.textContent = '↕️ Dale vuelta a la carta';
    }, 1350);

    launchConfetti();
  });

  // Click card → flip
  card.addEventListener('click', () => {
    if (!opened) return;
    flipped = !flipped;
    card.classList.toggle('flipped', flipped);
    hint.textContent = flipped ? '↩️ Dale vuelta de nuevo' : '↕️ Dale vuelta a la carta';
  });

  // Confetti
  function launchConfetti() {
    const ct = document.getElementById('confetti');
    const colors = ['#7c3aed','#f59e0b','#10b981','#ef4444','#3b82f6','#ec4899','#fbbf24','#fff'];
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left   = (5 + Math.random() * 90) + '%';
      p.style.top    = (Math.random() * 40) + '%';
      p.style.width  = (6 + Math.random() * 9) + 'px';
      p.style.height = (6 + Math.random() * 9) + 'px';
      p.style.background   = colors[Math.floor(Math.random() * colors.length)];
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      p.style.animationDelay    = (Math.random() * 0.7) + 's';
      p.style.animationDuration = (1.3 + Math.random() * 1.5) + 's';
      ct.appendChild(p);
      setTimeout(() => p.remove(), 3500);
    }
  }
</script>
</body>
  </html>
